spring:
  application:
    name: ballot

  jackson:
    serialization:
      write-dates-as-timestamps: false

  # ===== DataSource =====
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ballotjava}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:moonriver}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000

  # ===== JPA =====
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    open-in-view: false

  # ===== Flyway =====
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ===== Mail =====
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@ballot.app}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    default-encoding: UTF-8

  # ===== Thymeleaf =====
  thymeleaf:
    check-template-location: true
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  # ===== Async =====
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100
      thread-name-prefix: ballot-async-

  scheduling:
    enabled: true

# ===== Server =====
server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
  compression:
    enabled: true

# ===== Security / JWT =====
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      access-token-expiration: 900000          # 15 minutes
      refresh-token-expiration: 604800000      # 7 days
      password-reset-token-expiration: 900000  # 15 minutes
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  mail:
    from: ${MAIL_FROM:noreply@ballot.app}
    from-name: "Ballot Platform"
    base-url: ${APP_BASE_URL:http://localhost:8080}
  rate-limiting:
    login:
      capacity: 5
      refill-tokens: 5
      refill-period-minutes: 15

# ===== SpringDoc / Swagger =====
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
  show-actuator: false

# ===== Logging =====
logging:
  level:
    com.ballot: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
